# Configuration of tools/file_headers.py

license = "Unlicense"

# The @author of files that have none.
author = "Gábor Krisztián Girhiny"

# Directories that #include <...> paths are relative to, from the repository root.
include_roots = ["."]

# Modules that may reach `stable` without a sibling *.test.cpp.
no_test_required = ["*.ex.cpp", "*/main.cpp"]

# Lines changed since a tag was set before it is reported as stale.
stale_lines = 100

# Commit subjects that count as a bug fix, for `frozen` files.
fix_commit_pattern = "(?i)\\bfix"

# The expected "Part of <project>" per path. The longest matching prefix wins.
[projects]
btx = "BTX Toolset"
daw = "Nexus Library"
libbtx = "BTX Toolset"
liblexy = "BTX Toolset"
libnxs = "Nexus Library"
msg-gen = "BTX Toolset"
